# nginx proxy address - http://172.17.0.1:60236

name: komodo
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  core:
    image: ghcr.io/mbecker20/komodo:latest
    container_name: komodo-core
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-localhost}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: komodo-core
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      KOMODO_TITLE: ${APP_ORG_NAME:-Komodo}
      KOMODO_HOST: http://${BASE_HOST_NAME:-localhost}
      KOMODO_DISABLE_CONFIRM_DIALOG: 'false'
      KOMODO_MONITORING_INTERVAL: '15-sec'
      KOMODO_RESOURCE_POLL_INTERVAL: '5-min'
      KOMODO_JWT_TTL: '1-day'
      KOMODO_JWT_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      KOMODO_WEBHOOK_SECRET: ${RPC_SECRET:-changeme_webhook_secret}
      KOMODO_LOCAL_AUTH: 'true'
      KOMODO_ENABLE_NEW_USERS: 'false'
      KOMODO_DISABLE_USER_REGISTRATION: 'false'
      KOMODO_DISABLE_NON_ADMIN_CREATE: 'false'
      KOMODO_TRANSPARENT_MODE: 'false'
      KOMODO_OIDC_ENABLED: 'false'
      KOMODO_GITHUB_OAUTH_ENABLED: 'false'
      KOMODO_GOOGLE_OAUTH_ENABLED: 'false'
      KOMODO_DATABASE_ADDRESS: komodo-db:27017
      KOMODO_DATABASE_USERNAME: ${DB_USER_NAME:-komodo}
      KOMODO_DATABASE_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      KOMODO_FIRST_SERVER: https://periphery:8120
    ports:
      - '172.17.0.1:60236:9120'
    volumes:
      - './volumes/data/komodo/repo-syncs:/syncs'
      - './volumes/data/komodo/repo-cache:/repo-cache'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - komodo
      - proxy
      - cloudflare
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://komodo-core:9120'
      - 'cloudflare.hostname=komodo.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.komodo-core.entrypoints=http'
      - 'traefik.http.routers.komodo-core-secure.tls=true'
      - 'traefik.http.routers.komodo-core.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.komodo-core-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.komodo-core.middlewares=komodo-core-https-redirect'
      - 'traefik.http.routers.komodo-core-secure.entrypoints=https'
      - 'traefik.http.routers.komodo-core-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.komodo-core-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.komodo-core-secure.service=komodo-core'
      - 'traefik.http.services.komodo-core.loadbalancer.server.port=9120'

  periphery:
    image: ghcr.io/mbecker20/periphery:latest
    container_name: komodo-periphery
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: komodo-periphery
      PERIPHERY_SSL_ENABLED: 'true'
      PERIPHERY_DISABLE_TERMINALS: 'false'
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_PASSKEYS: ${APP_SECRET_KEY:-changeme_passkey}
    volumes:
      - '/proc:/proc'
      - './volumes/config/komodo/repos:/etc/komodo'
      - './volumes/data/komodo/repos:/etc/komodo/repos'
      - './volumes/data/komodo/stacks:/etc/komodo/stacks'
      - '/var/run/docker.sock:/var/run/docker.sock'
    networks:
      - komodo

  db:
    image: mongo:latest
    container_name: komodo-db
    restart: always
    pull_policy: always
    logging: *default-logging
    command: --quiet --wiredTigerCacheSizeGB 0.25
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: komodo-db
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER_NAME:-komodo}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - './volumes/data/db/mongo/komodo:/data/db'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.stats().ok"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - komodo

networks:
  komodo:
    name: komodo
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
